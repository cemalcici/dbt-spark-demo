name: olist_demo
version: "1.0.0"
config-version: 2
profile: olist_demo

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets: [target, dbt_packages]

models:
  olist_demo:
    staging:
      +materialized: view      # ucuz: sadece tanım, veri yazılmaz
    intermediate:
      +materialized: view
    marts:
      +materialized: table     # pahalı hesap bir kez yapılır, parquet olarak yazılır
      +file_format: parquet
